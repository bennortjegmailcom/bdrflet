[project]
name = "bdr-mobile"
version = "1.0.0"
description = "An Android-first mobile companion for the industrial Breakdown Reporter system."
requires-python = ">=3.12"
authors = [
    { name = "Ben Nortje", email = "ben.nortje@gmail.com" }
]
dependencies = [
    "flet"
]

[dependency-groups]
dev = [
    "flet-cli",
    "flet-desktop",
    "flet-web"
]

[tool.flet.metadata]
title = "BDR Mobile"

[tool.flet]
org = "dev.flet"
company = "Ben Nortje"
copyright = "Copyright (C) 2026 by Ben Nortje"

[tool.flet.app]
path = "src"
